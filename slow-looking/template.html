<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Над вечным покоем — медленный взгляд</title>
<style>
:root{--bg:#0c0d0e;--fg:#ebe7de;--mut:#8f8c85;--acc:#e0c98f;--line:#2b2c2d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"PT Serif","Times New Roman",serif}
.app{display:flex;flex-direction:column;height:100%}
.view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 12px 0}
.frame{position:relative;aspect-ratio:2000/1434;width:min(100%,calc((100vh - 210px)*1.3947));background:#000;box-shadow:0 12px 50px #000c}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.start{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:#000c;text-align:center;padding:20px;z-index:3}
.start h1{margin:0;font-weight:normal;font-size:clamp(24px,4.4vw,40px);letter-spacing:.02em}
.start p{margin:0;color:#b9b5ac;max-width:32em;line-height:1.5}
.start .big{font-size:18px;padding:12px 28px;border-color:var(--acc)}
.panel{padding:12px 16px 16px;max-width:920px;margin:0 auto;width:100%}
.title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);min-height:1.3em}
.cap{min-height:4.6em;font-size:clamp(16px,2.1vw,20px);line-height:1.5;margin-top:4px;transition:opacity .8s}
.cap.hid{opacity:0}
.bar{height:3px;background:var(--line);margin:8px 0 10px;cursor:pointer}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .6s linear}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut)}
button,select,label.btn{background:#1a1b1c;color:var(--fg);border:1px solid #3a3b3c;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--acc)}
select{max-width:200px}
label.btn input{display:none}
.sp{flex:1}
#time{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
 <div class="view"><div class="frame" id="frame">
  <canvas id="cv"></canvas>
  <div class="start" id="start">
   <h1>Над вечным покоем</h1>
   <p>Исаак Левитан, 1894. Холст, масло, 150 × 206 см. Третьяковская галерея.</p>
   <p>Около десяти минут. Наденьте наушники, погасите свет, разверните на весь экран.</p>
   <button class="big" id="go">Начать</button>
  </div>
 </div></div>
 <div class="panel">
  <div class="title" id="ttl"></div>
  <div class="cap" id="cap"></div>
  <div class="bar" id="bar"><i id="prog"></i></div>
  <div class="row">
   <button id="pp">Пауза</button><button id="prev">←</button><button id="next">→</button>
   <span id="time"></span>
   <span class="sp"></span>
   <select id="voice" title="Голос"></select>
   <button id="subs" title="Субтитры">Аа</button>
   <label class="btn" title="Подставить свой скан той же картины">Свой скан<input type="file" id="file" accept="image/*"></label>
   <button id="fs" title="Во весь экран">⛶</button>
  </div>
 </div>
</div>
<img id="src" src="__IMG__" alt="" hidden>
<script>
/*
 Сценарий. Каждая глава — шаги:
   "текст"            — произносится голосом, показывается субтитром;
   число              — тишина, секунд;
   {f:[cx,cy,z,rx,ry], ms} — камера плывёт к точке (cx,cy — доли картины, z — увеличение,
                        rx,ry — полуоси подсветки в долях картины, 0 — без подсветки).
                        ms — длительность наезда, по умолчанию 4000.
 Координаты в долях, поэтому подставленный скан того же кадрирования работает без правок.
*/
const W0=[.5,.5,1,0,0];
const CH=[
{t:"Тишина",s:[
 {f:W0,ms:10},
 "Здравствуйте. Ближайшие десять минут мы проведём с одной картиной. Только с одной.",
 "Исаак Левитан. «Над вечным покоем». Тысяча восемьсот девяносто четвёртый год.",
 "Ничего не нужно знать заранее. Просто смотрите. Первые полминуты я помолчу.",
 {f:[.5,.5,1.06,0,0],ms:30000},
 22,
 "Куда ушёл ваш взгляд?",
 2,
 "Почти у всех — сначала вниз, к маленькой церкви. Потом — вверх, в небо. Запомните этот путь. Мы пройдём его ещё раз. Медленно.",
 3]},
{t:"Масштаб",s:[
 {f:[.5,.5,1,0,0]},
 "Представьте этот холст в зале Третьяковки. Два метра в ширину. Полтора — в высоту. Он больше, чем вы с раскинутыми руками.",
 {f:[.37,.69,1.25,.07,.09],ms:6000},
 "А церковь на нём — размером с ладонь.",
 2,
 "Левитан сделал так нарочно. Огромный мир. И маленький человеческий знак в нём.",
 4]},
{t:"Свет",s:[
 {f:[.36,.17,1.9,.22,.14],ms:6000},
 "Поднимитесь в небо. Вот здесь, слева, между облаками, — бледная, почти лимонная прореха.",
 "Свет не льётся. Он сочится.",
 4,
 "Рассказывают, что Левитан мог часами лежать в траве и смотреть на облака — и ни разу не взять в руки кисть. Его спутники нервничали: лето уходит, работа стоит. А он отвечал, что как раз работает.",
 {f:[.3,.2,2.4,.15,.1],ms:9000},
 "Присмотритесь к мазкам. Они лёгкие, протянуты вбок. Будто кисть сама летела по ветру.",
 5]},
{t:"Туча",s:[
 {f:[.76,.18,1.8,.25,.2],ms:6000},
 "А теперь — направо.",
 2,
 "Туча. Свинцовая, огромная, тяжёлая. Она ещё не пришла. Она идёт.",
 "Над водой пока светло. А там, справа, уже темнеет.",
 3,
 "Говорят, сам Левитан писал об этой картине так: «Вечность. Грозная вечность, в которой потонули поколения — и потонут ещё».",
 2,
 "Слышите? Не тихая вечность. Грозная.",
 5]},
{t:"Дорога облака",s:[
 {f:[.5,.32,2.2,.12,.07],ms:5000},
 "Опустите взгляд чуть ниже. Видите длинную белую полосу облака — как росчерк пера?",
 "Проведите по ней глазами. Медленно. Слева направо.",
 {f:[.86,.33,2.2,.12,.07],ms:11000},
 11,
 "Это дорога. Через всю картину — к горизонту. Туда, куда не дойти.",
 4]},
{t:"Вода",s:[
 {f:[.62,.7,1.3,.36,.18],ms:6000},
 "Вода.",
 2,
 "Многие думают, что это Волга. Нет. Это озеро Удомля, в Тверской губернии. Левитан жил там летом, писал этюды неба, воды, надвигающейся грозы — и из них, как из нот, собрал эту картину.",
 "Посмотрите, как он её написал. Ни волн, ни бликов, ни лодки. Огромная светлая пустота.",
 3,
 "Вода повторяет небо — но тише. Будто небо рассказывает, а вода молчит в ответ.",
 {f:[.62,.72,1.38,.36,.18],ms:12000},
 10]},
{t:"Остров",s:[
 {f:[.72,.605,3,.14,.04],ms:7000},
 "Там, вдали, — остров. Узкая полоска земли. Несколько кустов.",
 "Он — единственное, за что цепляется взгляд в этой пустоте. Не будь его, вода стала бы бесконечной. С ним — она просто очень большая.",
 5]},
{t:"Церковь",s:[
 {f:[.37,.7,1.8,.09,.12],ms:7000},
 "Теперь — вниз. К церкви. Подойдём ближе.",
 {f:[.37,.71,2.8,.07,.1],ms:7000},
 4,
 "Маленькая. Деревянная. Старая. Кровля поросла мхом, брёвна потемнели. Она стоит на самом краю обрыва.",
 "Говорят, на Удомле такой церкви не было. Левитан принёс её из другого места — из Плёса, на Волге, где за несколько лет до того написал этюд деревянной церквушки. Той церкви давно нет. Говорят, она сгорела. Осталась — только здесь.",
 5]},
{t:"Огонёк",s:[
 {f:[.366,.785,3.6,.03,.03],ms:8000},
 "А теперь посмотрите внимательно. В самом низу. Под деревом, у стены.",
 4,
 "Окошко. И в нём — свет.",
 4,
 "Крошечная тёплая точка. Единственное тёплое живое пятно во всём этом огромном холодном мире.",
 "Кто-то там есть. Кто-то зажёг свечу.",
 8]},
{t:"Ветер",s:[
 {f:[.24,.72,1.9,.13,.15],ms:7000},
 "Рядом — деревья. Их гнёт ветер. Это единственное, что на картине движется по-настоящему.",
 "Наверху — вечность. Внизу — ветер.",
 3,
 "Так ведь и в жизни. На земле всегда дует.",
 5]},
{t:"Кресты",s:[
 {f:[.15,.82,1.6,0,0],ms:6000},
 "А теперь — самое главное. Я берёг это для вас.",
 "Посмотрите в левый нижний угол. Ниже деревьев. На склоне.",
 {f:[.085,.88,3.4,.08,.08],ms:12000},
 9,
 "Кресты.",
 4,
 "Деревянные. Покосившиеся. Один упал. Могильные плиты уходят в землю, и трава их уже почти скрыла.",
 "Сельское кладбище. Его почти никто не замечает с первого взгляда. А заметив — уже не может развидеть.",
 5,
 "Вот он, вечный покой. Не в небе. Не в воде. Здесь. Под этой травой.",
 {f:[.25,.78,1.6,.25,.15],ms:8000},
 "И церковь теперь — не просто церковь. Она сторож. Она стоит над ними. Над теми, кто уже не слышит ветра.",
 8]},
{t:"Человек",s:[
 {f:[.5,.5,1,.6,.6],ms:6000},
 "Теперь — о человеке, который это написал.",
 2,
 "Исаак Левитан. Сын бедного еврейского учителя. В юности остался без родителей и без денег. Говорят, ночевал в пустых классах училища, потому что идти было некуда.",
 "Дважды его выселяли из Москвы — только за то, что он еврей. В последний раз — за два года до этой картины.",
 3,
 "Его ближайший друг — Антон Чехов. Они дружили с юности. А потом Чехов написал рассказ «Попрыгунья», и вся Москва узнала в нём Левитана. Они не разговаривали три года.",
 "Говорят, однажды Левитан застрелил чайку и положил её к ногам женщины. Чехов запомнил. Так появилась «Чайка».",
 3,
 "Он страдал от тоски — тяжёлой, чёрной. Через год после этой картины он выстрелил в себя. Выжил.",
 "И у него было больное сердце. Он знал, что жить ему недолго.",
 5,
 {f:[.37,.72,1.5,.1,.13],ms:7000},
 "Закончив картину, он написал Павлу Третьякову, который купил её для своей галереи: «В ней я весь, со всей своей психикой, со всем моим содержанием».",
 3,
 "Весь. Этот обрыв. Эта туча. Эти кресты. И этот огонёк в окне.",
 7]},
{t:"Тридцать девять",s:[
 {f:[.366,.785,3.2,.04,.04],ms:8000},
 "Левитан умер летом тысяча девятисотого года. Ему было тридцать девять.",
 3,
 "Перед смертью, говорят, он попросил брата сжечь все свои письма. И брат сжёг.",
 3,
 "А через сорок лет его прах перенесли на Новодевичье кладбище. Теперь он лежит неподалёку от Чехова.",
 "Помирились. Навсегда.",
 9]},
{t:"Ещё раз",s:[
 {f:[.5,.5,1,0,0],ms:12000},
 "Отойдём назад. Посмотрим на всю картину сразу.",
 4,
 "Теперь вы знаете, куда смотреть. Небо, которое идёт. Вода, которая молчит. Ветер в деревьях. Кресты, которых не видно с первого взгляда. И огонёк.",
 3,
 "Посмотрите на неё ещё раз. Уже без меня.",
 {f:[.5,.5,1.05,0,0],ms:20000},
 18,
 "Мы с вами стоим на этом обрыве. Пока ещё на ветру. Пока ещё живые.",
 3,
 "Вечный покой подождёт.",
 2,
 "А огонёк в окне — горит.",
 10,
 "Спасибо."]}
];

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),cap=$('cap'),ttl=$('ttl'),prog=$('prog'),pp=$('pp'),sel=$('voice');
let img=$('src');

/* ---------- камера ---------- */
const cam={cx:.5,cy:.5,z:1,rx:0,ry:0,sp:0};
let anim=null;
function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
function draw(){
 if(!img.naturalWidth)return;
 const W=cv.width,H=cv.height,iw=img.naturalWidth,ih=img.naturalHeight;
 const sw=iw/cam.z,sh=ih/cam.z;
 let sx=cam.cx*iw-sw/2,sy=cam.cy*ih-sh/2;
 sx=Math.max(0,Math.min(iw-sw,sx));sy=Math.max(0,Math.min(ih-sh,sy));
 ctx.imageSmoothingQuality='high';
 ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
 if(cam.sp>.01){
  const k=W/sw,px=(cam.cx*iw-sx)*k,py=(cam.cy*ih-sy)*k;
  const ex=Math.max(4,cam.rx*iw*k*1.35),ey=Math.max(4,cam.ry*ih*k*1.35);
  ctx.save();ctx.translate(px,py);ctx.scale(1,ey/ex);
  const g=ctx.createRadialGradient(0,0,0,0,0,ex);
  const a=.8*cam.sp;
  g.addColorStop(0,'rgba(6,7,8,0)');g.addColorStop(.55,'rgba(6,7,8,0)');g.addColorStop(1,`rgba(6,7,8,${a})`);
  ctx.fillStyle=g;ctx.fillRect(-W*4,-H*4*ex/ey,W*8,H*8*ex/ey);
  ctx.restore();
  // за пределами эллипса градиент держит последний цвет — дальнее поле затемнено равномерно
 }
}
function frame(now){
 if(anim){
  const k=Math.min(1,(now-anim.t0)/anim.ms),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  for(const p in anim.to)cam[p]=anim.from[p]+(anim.to[p]-anim.from[p])*e;
  if(k>=1)anim=null;
 }
 draw();requestAnimationFrame(frame);
}
function glide(f,ms=4000){
 const [cx,cy,z,rx,ry]=f;const on=rx>0;
 const to={cx,cy,z,sp:on?1:0};if(on){to.rx=rx;to.ry=ry}
 anim={from:{...cam},to,t0:performance.now(),ms:Math.max(1,ms)};
}

/* ---------- голос ---------- */
const ss=window.speechSynthesis;let voices=[];
function loadVoices(){
 voices=(ss?ss.getVoices():[]).filter(v=>/^ru/i.test(v.lang));
 const keep=sel.value;sel.innerHTML='';
 if(!voices.length){sel.innerHTML='<option>нет русского голоса — только субтитры</option>';return}
 voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name;sel.appendChild(o)});
 const best=voices.findIndex(v=>/natural|neural|online|google|milena|dmitry|svetlana|yuri/i.test(v.name));
 sel.value=keep&&voices[keep]?keep:(best>=0?best:0);
}
if(ss){loadVoices();ss.onvoiceschanged=loadVoices}else sel.innerHTML='<option>синтез речи недоступен</option>';

/* ---------- проигрыватель ---------- */
let ci=-1,token=0,paused=false;
const CPS=12.5; // знаков в секунду — оценка для таймлайна и для режима без голоса
const dur=st=>typeof st==='number'?st:typeof st==='string'?st.length/CPS+.9:0;
const chDur=CH.map(c=>c.s.reduce((a,s)=>a+dur(s),0));
const TOTAL=chDur.reduce((a,b)=>a+b,0);
let elapsedBase=0,stepStart=0,stepLen=0;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function tick(){
 if(ci>=0){const cur=Math.min(TOTAL,elapsedBase+(paused?0:Math.min(stepLen,(performance.now()-stepStart)/1000)));
  prog.style.width=(cur/TOTAL*100)+'%';$('time').textContent=fmt(cur)+' / '+fmt(TOTAL)}
}
setInterval(tick,500);
function sleep(sec,tk){
 return new Promise(res=>{let left=sec*1000,last=performance.now();
  (function loop(){if(tk!==token)return res();const n=performance.now();if(!paused)left-=n-last;last=n;
   left<=0?res():setTimeout(loop,100)})()});
}
function speak(text,tk){
 return new Promise(res=>{
  if(tk!==token)return res();
  if(!(ss&&voices.length))return sleep(text.length/CPS,tk).then(res);
  const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.88;u.pitch=.95;
  u.voice=voices[+sel.value]||voices[0];
  let done=false;const fin=()=>{if(!done){done=true;res()}};
  u.onend=u.onerror=fin;
  // страховка: в некоторых браузерах onend теряется
  const guard=()=>{if(done||tk!==token)return fin();if(!ss.speaking&&!ss.pending&&!paused)return fin();setTimeout(guard,1000)};
  setTimeout(guard,2500);
  ss.speak(u);
 });
}
async function play(i){
 if(i<0||i>=CH.length)return;
 token++;const tk=token;ci=i;paused=false;pp.textContent='Пауза';
 if(ss)ss.cancel();
 elapsedBase=chDur.slice(0,i).reduce((a,b)=>a+b,0);
 ttl.textContent=(i+1)+' · '+CH[i].t;
 cap.classList.add('hid');
 for(const st of CH[i].s){
  if(tk!==token)return;
  stepStart=performance.now();stepLen=dur(st);
  if(typeof st==='object'){glide(st.f,st.ms);continue}
  if(typeof st==='number'){cap.classList.add('hid');await sleep(st,tk)}
  else{cap.textContent=st;cap.classList.remove('hid');await speak(st,tk);if(tk!==token)return;await sleep(.9,tk)}
  elapsedBase+=stepLen;stepLen=0;
 }
 if(tk!==token)return;
 if(i+1<CH.length)play(i+1);else{ttl.textContent='';cap.classList.add('hid')}
}
function togglePause(){
 if(ci<0)return;paused=!paused;pp.textContent=paused?'Дальше':'Пауза';
 if(ss){paused?ss.pause():ss.resume()}
}
$('go').onclick=()=>{$('start').remove();play(0)};
$('next').onclick=()=>play(Math.min(CH.length-1,ci+1));
$('prev').onclick=()=>play(Math.max(0,ci-1));
pp.onclick=togglePause;
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),t=(e.clientX-r.left)/r.width*TOTAL;
 let a=0,i=0;while(i<CH.length-1&&a+chDur[i]<t){a+=chDur[i];i++}if($('start'))$('start').remove();play(i)};
$('subs').onclick=()=>{cap.style.visibility=cap.style.visibility==='hidden'?'':'hidden'};
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const n=new Image();n.onload=()=>{img=n;draw()};n.src=URL.createObjectURL(f)};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePause()}else if(e.code==='ArrowRight')$('next').click();else if(e.code==='ArrowLeft')$('prev').click()});
addEventListener('resize',size);
$('time').textContent='0:00 / '+fmt(TOTAL);
const boot=()=>{size();requestAnimationFrame(frame)};img.complete?boot():img.onload=boot;
</script>
</body>
</html>
